  .final { min-height:50px; font-size:18px; font-weight:800; color:#c21658; white-space:pre-line; }
  .controls { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .control {
    border:0; border-radius:16px; padding:14px 20px; font-size:16px; font-weight:800; cursor:pointer;

let index = 0;
let started = false;
let audioCtx = null;
let musicTimer = null;
let musicOn = false;

function startApp() {
  started = true;
  document.getElementById('intro').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  show();
  petals(18);
  setTimeout(() => petals(10), 700);
}

function show() {
  const item = idiomas[index];
  document.getElementById('counter').textContent = `${index + 1} / 200`;
  document.getElementById('language').textContent = item.idioma;
  document.getElementById('phrase').textContent = `“${item.frase}”`;
  document.getElementById('final').textContent =
    index === idiomas.length - 1 ? "❤️ Y después de 200 idiomas...\nTODAVÍA TE AMO ❤️" : "";

  const card = document.getElementById('card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'cardIn .35s ease-out';
}

function next() {
  if (index < idiomas.length - 1) {
    index++;
    show();
    petals(5);
  } else {
    showToast("💗 Llegaste al final... y después de 200 idiomas, todavía te amo. ❤️");
    petals(20);
  }
}

function previous() {
  if (index > 0) {
    index--;
    show();
  }
}

function petals(amount) {
  for (let i=0;i<amount;i++) {
    const p=document.createElement('div');
    p.className='petal';
    p.textContent = Math.random()>.45 ? '🌸' : '💗';
    p.style.left=(Math.random()*100)+'vw';
    p.style.fontSize=(14+Math.random()*20)+'px';
    p.style.setProperty('--x',(-120+Math.random()*240)+'px');
    p.style.animationDuration=(3.5+Math.random()*4)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),8000);
  }
}

function showToast(text) {
  const t=document.getElementById('toast');
  t.textContent=text; t.style.display='block';
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.style.display='none',4200);
}

function toggleMusic() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (musicOn) {
    clearInterval(musicTimer);
    musicOn=false;
    document.getElementById('musicBtn').textContent='🎵 Música: OFF';
    return;
  }
  musicOn=true;
  document.getElementById('musicBtn').textContent='🎵 Música: ON';
  playMelody();
}

function playTone(freq, duration, startTime) {
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.0001,startTime);
  gain.gain.exponentialRampToValueAtTime(0.07,startTime+0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001,startTime+duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(startTime); osc.stop(startTime+duration+0.03);
}

function playMelody() {
  if (!musicOn) return;
  const notes=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
  const now=audioCtx.currentTime;
  notes.forEach((n,i)=>playTone(n,.42,now+i*.48));
  clearInterval(musicTimer);
  musicTimer=setTimeout(playMelody, notes.length*480);
}

document.addEventListener('keydown', e => {
  if (!started) return;
  if (e.key==='ArrowRight') next();
  if (e.key==='ArrowLeft') previous();
});
</script>
